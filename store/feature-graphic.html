<!doctype html><html><head><meta charset="utf-8">

<style>
 *{margin:0;padding:0;box-sizing:border-box}
 body{background:#111}
 /* 1024x500 exactly — Play rejects anything else for the feature graphic.
    Bright to match the new screenshots; the old one was near-black and clashed. */
 .fg{width:1024px;height:500px;position:relative;overflow:hidden;
   background:linear-gradient(115deg,#5b6cff 0%,#8b5cf6 46%,#e11d48 100%);
   display:flex;align-items:center;gap:44px;padding:0 66px;
   font-family:'DM Sans',system-ui,sans-serif}
 .fg::before{content:'';position:absolute;width:760px;height:760px;left:-250px;top:-330px;
   border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.24),transparent 62%)}
 .fg::after{content:'';position:absolute;width:620px;height:620px;right:-190px;bottom:-260px;
   border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 62%)}
 .icon{position:relative;z-index:2;width:150px;height:150px;border-radius:36px;flex:0 0 auto;
   box-shadow:0 18px 46px rgba(0,0,0,.32);overflow:hidden}
 .icon img{width:100%;height:100%;display:block}
 .txt{position:relative;z-index:2}
 h1{font-family:'Sora',sans-serif;font-weight:800;font-size:78px;color:#fff;
   letter-spacing:-2.4px;line-height:1;text-shadow:0 3px 20px rgba(0,0,0,.2)}
 .tag{margin-top:14px;font-size:25px;font-weight:500;color:rgba(255,255,255,.94);line-height:1.32}
 .pills{margin-top:22px;display:flex;gap:11px}
 .pill{font-size:17px;font-weight:700;color:#fff;padding:9px 17px;border-radius:99px;
   background:rgba(255,255,255,.19);border:1.5px solid rgba(255,255,255,.34);white-space:nowrap}
</style></head><body>
