<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Bricolage Grotesque'; font-weight: 500 800; src: url('../../fonts/self/bricolage.woff2') format('woff2'); }
body { margin: 0; background: #e9e6e1; font-family: 'Bricolage Grotesque', sans-serif; }
.row { display: flex; gap: 40px; padding: 40px; }
.c { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.c svg { width: 300px; height: 300px; border-radius: 66px; box-shadow: 0 20px 40px rgba(0,0,0,.18); }
.small { display: flex; gap: 14px; align-items: center; }
.small svg { width: 48px; height: 48px; border-radius: 11px; box-shadow: none; }
.lbl { font-weight: 700; font-size: 22px; color: #222; }
</style></head><body><div class="row">

<!-- A: sunrise over the log lines -->
<div class="c"><svg id="A" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="Abg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1d3a"/><stop offset="1" stop-color="#0d0f22"/></linearGradient>
    <linearGradient id="Asun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset=".55" stop-color="#ff8a4c"/><stop offset="1" stop-color="#ff5470"/></linearGradient>
    <radialGradient id="Aglow" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#ff8a4c" stop-opacity=".45"/><stop offset="1" stop-color="#ff8a4c" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#Abg)"/>
  <circle cx="256" cy="262" r="190" fill="url(#Aglow)"/>
  <path d="M136 262 A120 120 0 0 1 376 262 Z" fill="url(#Asun)"/>
  <rect x="104" y="286" width="304" height="22" rx="11" fill="#fff4e6"/>
  <rect x="146" y="336" width="220" height="22" rx="11" fill="#fff4e6" opacity=".7"/>
  <rect x="188" y="386" width="136" height="22" rx="11" fill="#fff4e6" opacity=".42"/>
</svg><div class="lbl">A · Sunrise log</div>
<div class="small"><svg viewBox="0 0 512 512"><use href="#A"/></svg></div></div>

<!-- B: the day ring -->
<div class="c"><svg id="B" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="Bbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6ec"/><stop offset="1" stop-color="#ffe6d3"/></linearGradient>
    <linearGradient id="Bring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset=".5" stop-color="#ff6a4d"/><stop offset="1" stop-color="#e2366f"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#Bbg)"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="#2a1f1b" stroke-opacity=".08" stroke-width="56"/>
  <circle cx="256" cy="256" r="138" fill="none" stroke="url(#Bring)" stroke-width="56" stroke-linecap="round" stroke-dasharray="650 867" transform="rotate(-90 256 256)"/>
  <circle cx="256" cy="256" r="44" fill="#2a1f1b"/>
</svg><div class="lbl">B · Day ring</div>
<div class="small"><svg viewBox="0 0 512 512"><use href="#B"/></svg></div></div>

<!-- C: a page with the sun on it -->
<div class="c"><svg id="C" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="Cbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a4f"/><stop offset="1" stop-color="#e83e6c"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#Cbg)"/>
  <path d="M150 104 H322 L374 156 V408 H150 Z" fill="#fff8ef"/>
  <path d="M322 104 V156 H374 Z" fill="#ffd9c4"/>
  <circle cx="262" cy="212" r="46" fill="#ffb347"/>
  <rect x="190" y="290" width="144" height="16" rx="8" fill="#e83e6c" opacity=".85"/>
  <rect x="190" y="326" width="104" height="16" rx="8" fill="#e83e6c" opacity=".45"/>
</svg><div class="lbl">C · Day page</div>
<div class="small"><svg viewBox="0 0 512 512"><use href="#C"/></svg></div></div>

</div></body></html>
