<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1024px;height:500px;overflow:hidden;background:#070b14;font-family:'DM Sans',system-ui,sans-serif;
    background-image:
      radial-gradient(70% 90% at 88% 15%, rgba(74,214,192,.16), transparent 62%),
      radial-gradient(60% 80% at 8% 85%, rgba(109,140,255,.20), transparent 60%),
      radial-gradient(50% 60% at 50% -10%, rgba(143,123,255,.14), transparent 65%);}
  .wrap{display:flex;align-items:center;height:100%;padding:0 74px;gap:52px}
  .mark{flex:0 0 auto;width:150px;height:150px;border-radius:34px;display:grid;place-items:center;
    background:linear-gradient(140deg,#16233f 0%,#12324a 55%,#14524c 100%);
    box-shadow:0 22px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.10)}
  .mark svg{width:96px;height:96px}
  h1{font-family:'Sora';font-size:76px;font-weight:800;letter-spacing:-2.5px;color:#f4f7ff;line-height:1}
  .tag{font-size:24px;font-weight:500;color:#9fb0cc;margin-top:14px;letter-spacing:-.2px}
  .chips{display:flex;gap:11px;margin-top:26px}
  .chip{font-size:15.5px;font-weight:700;color:#d3ddf5;background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:10px 18px;white-space:nowrap}
  .chip b{color:#8fe3d4;font-weight:700}
</style></head><body>
<div class="wrap">
  <div class="mark">
    <svg viewBox="0 0 24 24" fill="none" stroke="#cfe6ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.5 12h4.2l2.1-6 3.1 12 2.4-7.2 1.7 3.2h5.5"/>
    </svg>
  </div>
  <div>
    <h1>Daylog</h1>
    <div class="tag">Habits, mood &amp; screen time — all on your phone.</div>
    <div class="chips">
      <span class="chip">🔒 <b>No account</b></span>
      <span class="chip">📴 Works offline</span>
      <span class="chip">🧠 Real insights</span>
    </div>
  </div>
</div></body></html>
